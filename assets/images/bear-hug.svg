<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <radialGradient id="bearBody" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#EED5C2"/>
      <stop offset="100%" stop-color="#CFA88A"/>
    </radialGradient>
    <radialGradient id="bearBelly" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFF5EA"/>
      <stop offset="100%" stop-color="#F2DFD0"/>
    </radialGradient>
    <linearGradient id="heartPink" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF758C"/>
      <stop offset="100%" stop-color="#FF7EB3"/>
    </linearGradient>
  </defs>

  <!-- Left Ear -->
  <circle cx="55" cy="50" r="22" fill="#CFA88A"/>
  <circle cx="55" cy="50" r="14" fill="#F4B8C5"/>

  <!-- Right Ear -->
  <circle cx="145" cy="50" r="22" fill="#CFA88A"/>
  <circle cx="145" cy="50" r="14" fill="#F4B8C5"/>

  <!-- Body -->
  <ellipse cx="100" cy="140" rx="60" ry="50" fill="url(#bearBody)"/>
  <ellipse cx="100" cy="145" rx="38" ry="32" fill="url(#bearBelly)"/>

  <!-- Head -->
  <circle cx="100" cy="85" r="50" fill="url(#bearBody)"/>

  <!-- Snout -->
  <ellipse cx="100" cy="98" rx="22" ry="16" fill="url(#bearBelly)"/>
  <path d="M 94,92 C 94,90 106,90 106,92 C 106,97 101,100 100,100 C 99,100 94,97 94,92 Z" fill="#5A3E36"/>
  <path d="M 100,100 L 100,105 M 95,104 Q 100,108 105,104" stroke="#5A3E36" stroke-width="2" stroke-linecap="round" fill="none"/>

  <!-- Cheeks Blush -->
  <circle cx="70" cy="95" r="8" fill="#FF8DA1" opacity="0.4"/>
  <circle cx="130" cy="95" r="8" fill="#FF8DA1" opacity="0.4"/>

  <!-- Eyes (Happy Arcs) -->
  <path d="M 75,78 Q 80,72 85,78" stroke="#4A332D" stroke-width="3" stroke-linecap="round" fill="none"/>
  <path d="M 115,78 Q 120,72 125,78" stroke="#4A332D" stroke-width="3" stroke-linecap="round" fill="none"/>

  <!-- Arms Hugging Heart -->
  <!-- Big Heart Held in Hands -->
  <path d="M 100,150 C 100,150 65,120 65,95 C 65,80 75,70 87,70 C 94,70 98,75 100,78 C 102,75 106,70 113,70 C 125,70 135,80 135,95 C 135,120 100,150 100,150 Z" 
        fill="url(#heartPink)"/>
  <circle cx="85" cy="88" r="4" fill="#FFF" opacity="0.6"/>

  <!-- Paws holding the heart -->
  <ellipse cx="68" cy="120" rx="14" ry="18" fill="#CFA88A" transform="rotate(30 68 120)"/>
  <ellipse cx="132" cy="120" rx="14" ry="18" fill="#CFA88A" transform="rotate(-30 132 120)"/>

  <!-- Floating Sparkles -->
  <circle cx="35" cy="110" r="3" fill="#FF9EAA"/>
  <circle cx="165" cy="100" r="3.5" fill="#FF9EAA"/>
  <path d="M 155,50 Q 155,56 161,56 Q 155,56 155,62 Q 155,56 149,56 Q 155,56 155,50 Z" fill="#FFB703"/>
</svg>

