<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 240" width="300" height="240">
  <defs>
    <linearGradient id="bgGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFEBEF"/>
      <stop offset="100%" stop-color="#F7D1DC"/>
    </linearGradient>
    <linearGradient id="coffeeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8D6E63"/>
      <stop offset="100%" stop-color="#5D4037"/>
    </linearGradient>
  </defs>
  <rect width="300" height="240" rx="10" fill="url(#bgGrad1)"/>
  
  <!-- Table surface -->
  <path d="M 0,180 Q 150,175 300,180 L 300,240 L 0,240 Z" fill="#E8BDC8" opacity="0.4"/>
  
  <!-- Coffee Saucer -->
  <ellipse cx="150" cy="185" rx="65" ry="16" fill="#FFFFFF" opacity="0.9"/>
  <ellipse cx="150" cy="183" rx="55" ry="12" fill="#F3CCD6"/>

  <!-- Coffee Cup -->
  <path d="M 105,120 C 105,170 195,170 195,120 Z" fill="#FFFFFF"/>
  <path d="M 195,130 C 215,130 215,160 190,160" stroke="#FFFFFF" stroke-width="8" stroke-linecap="round" fill="none"/>
  
  <!-- Coffee surface -->
  <ellipse cx="150" cy="122" rx="42" ry="12" fill="url(#coffeeGrad)"/>
  
  <!-- Latte Art Heart -->
  <path d="M 150,126 C 150,126 135,116 135,110 C 135,105 140,101 146,101 C 149,101 150,103 150,105 C 150,103 151,101 154,101 C 160,101 165,105 165,110 C 165,116 150,126 150,126 Z" 
        fill="#FFF9F5" opacity="0.9"/>

  <!-- Steam wisps -->
  <path d="M 135,95 Q 130,80 140,65 Q 150,50 142,35" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.6"/>
  <path d="M 160,90 Q 170,75 162,60 Q 155,45 165,30" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.6"/>

  <!-- Floating Sparkles -->
  <circle cx="70" cy="80" r="3" fill="#EE6B8B" opacity="0.7"/>
  <circle cx="235" cy="95" r="4" fill="#EE6B8B" opacity="0.6"/>
  <circle cx="250" cy="65" r="2.5" fill="#EE6B8B" opacity="0.8"/>
  <path d="M 60,50 Q 60,56 66,56 Q 60,56 60,62 Q 60,56 54,56 Q 60,56 60,50 Z" fill="#EE6B8B" opacity="0.7"/>
</svg>
