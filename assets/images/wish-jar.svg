<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 240" width="200" height="240">
  <defs>
    <radialGradient id="jarGlow" cx="50%" cy="55%" r="45%">
      <stop offset="0%" stop-color="#FFF8E7" stop-opacity="0.9"/>
      <stop offset="40%" stop-color="#FFEAA7" stop-opacity="0.6"/>
      <stop offset="85%" stop-color="#FF758C" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#FF758C" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="glassGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.5"/>
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.4"/>
    </linearGradient>
  </defs>

  <!-- Cork Stopper -->
  <path d="M 75,30 L 125,30 L 120,48 L 80,48 Z" fill="#D4A373" stroke="#BA8454" stroke-width="2"/>
  <rect x="70" y="46" width="60" height="10" rx="3" fill="#EAD2AC" stroke="#BA8454" stroke-width="1.5"/>

  <!-- Hanging Tag with Heart -->
  <path d="M 125,52 Q 145,65 140,85" stroke="#BA8454" stroke-width="2" fill="none"/>
  <rect x="130" y="80" width="22" height="30" rx="3" fill="#FFFBF5" stroke="#D4A373" stroke-width="1.5"/>
  <path d="M 141,96 C 141,96 135,91 135,88 C 135,85 137,84 139,84 C 140,84 141,85 141,86 C 141,85 142,84 143,84 C 145,84 147,85 147,88 C 147,91 141,96 141,96 Z" fill="#EE6B8B"/>

  <!-- Glass Jar Body -->
  <path d="M 75,54 C 50,60 40,85 40,120 C 40,185 50,215 75,220 L 125,220 C 150,215 160,185 160,120 C 160,85 150,60 125,54 Z" 
        fill="url(#glassGrad)" stroke="#FFFFFF" stroke-width="3"/>

  <!-- Inner Warm Stardust Glow -->
  <ellipse cx="100" cy="145" rx="45" ry="60" fill="url(#jarGlow)"/>

  <!-- Glowing Stars Inside Jar -->
  <g fill="#FFEAA7">
    <!-- Star 1 -->
    <path d="M 100,105 Q 100,113 106,113 Q 100,113 100,121 Q 100,113 94,113 Q 100,113 100,105 Z" fill="#FFF"/>
    <!-- Star 2 -->
    <path d="M 75,135 Q 75,142 80,142 Q 75,142 75,149 Q 75,142 70,142 Q 75,142 75,135 Z" fill="#FFD166"/>
    <!-- Star 3 -->
    <path d="M 125,140 Q 125,146 129,146 Q 125,146 125,152 Q 125,146 121,146 Q 125,146 125,140 Z" fill="#FFB703"/>
    <!-- Star 4 -->
    <path d="M 95,165 Q 95,172 101,172 Q 95,172 95,179 Q 95,172 89,172 Q 95,172 95,165 Z" fill="#FFF"/>

    <!-- Tiny stardust specks -->
    <circle cx="85" cy="115" r="2" fill="#FFF"/>
    <circle cx="115" cy="125" r="2.5" fill="#FFEAA7"/>
    <circle cx="110" cy="160" r="1.5" fill="#FFF"/>
    <circle cx="80" cy="175" r="2" fill="#FFD166"/>
    <circle cx="120" cy="180" r="2" fill="#FFF"/>
  </g>

  <!-- Glass Light Reflection streak -->
  <path d="M 55,90 C 50,115 50,165 58,195" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" fill="none" opacity="0.6"/>
</svg>
