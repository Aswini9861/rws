<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 240" width="300" height="240">
  <defs>
    <linearGradient id="sunsetGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FF9EAA"/>
      <stop offset="45%" stop-color="#FFCAD4"/>
      <stop offset="80%" stop-color="#FCD5CE"/>
      <stop offset="100%" stop-color="#E8E8E4"/>
    </linearGradient>
    <radialGradient id="sunGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFF9EC"/>
      <stop offset="60%" stop-color="#FFEAA7"/>
      <stop offset="100%" stop-color="#FFAAA6" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="300" height="240" rx="10" fill="url(#sunsetGrad)"/>

  <!-- Golden Sun -->
  <circle cx="150" cy="140" r="50" fill="url(#sunGlow)"/>
  <circle cx="150" cy="140" r="28" fill="#FFFBF0"/>

  <!-- Fence / Window sill -->
  <rect x="0" y="185" width="300" height="15" fill="#4A3B4E" opacity="0.9"/>
  <rect x="0" y="200" width="300" height="40" fill="#362939"/>

  <!-- Left Kitten Silhouette -->
  <!-- Body & Head -->
  <ellipse cx="125" cy="165" rx="14" ry="20" fill="#2B1E2E"/>
  <circle cx="125" cy="140" r="10" fill="#2B1E2E"/>
  <!-- Ears -->
  <polygon points="117,135 119,126 124,133" fill="#2B1E2E"/>
  <polygon points="126,133 131,126 133,135" fill="#2B1E2E"/>
  <!-- Tail -->
  <path d="M 112,175 Q 100,165 106,155" stroke="#2B1E2E" stroke-width="4" stroke-linecap="round" fill="none"/>

  <!-- Right Kitten Silhouette (leaning slightly) -->
  <!-- Body & Head -->
  <ellipse cx="152" cy="165" rx="13" ry="19" fill="#2B1E2E"/>
  <circle cx="150" cy="141" r="9.5" fill="#2B1E2E"/>
  <!-- Ears -->
  <polygon points="143,136 145,128 149,134" fill="#2B1E2E"/>
  <polygon points="152,134 156,128 158,136" fill="#2B1E2E"/>
  <!-- Tail touching & forming heart loop -->
  <path d="M 163,175 Q 175,160 160,150 Q 148,155 140,168" stroke="#2B1E2E" stroke-width="4" stroke-linecap="round" fill="none"/>

  <!-- Little heart between tails -->
  <path d="M 139,120 C 139,120 134,114 134,110 C 134,106 137,104 139,104 C 140,104 141,105 141,106 C 141,105 142,104 144,104 C 146,104 149,106 149,110 C 149,114 139,120 139,120 Z" fill="#EE6B8B"/>
</svg>

